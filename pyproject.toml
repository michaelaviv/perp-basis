[project]
name = "perp-basis"
version = "0.1.0"
description = "5-min snapshots of Gold and WTI Crude Oil across Binance, OKX, Hyperliquid perpetuals and CME futures (via Yahoo)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyarrow>=17",
    "polars>=1.6",
    "pydantic>=2.8",
    "yfinance>=0.2.40",
    "duckdb>=1.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
perp-snapshot = "perp_basis.snapshot:main"
perp-compact = "perp_basis.compact:main"
perp-backfill-cme = "perp_basis.backfill_cme:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perp_basis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
