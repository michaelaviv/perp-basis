name: capture

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Take snapshot
        env:
          # GitHub Actions runners are US-based; fapi.binance.com returns HTTP 451.
          # Skip Binance until a non-US relay (Cloudflare Worker / EU VPS) is in place.
          PERP_BASIS_DISABLE_VENUES: binance
        run: python -m perp_basis.snapshot

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: perp-basis-bot
          GIT_AUTHOR_EMAIL: perp-basis-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-basis-bot
          GIT_COMMITTER_EMAIL: perp-basis-bot@users.noreply.github.com
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M:%SZ")
          git commit -m "snapshot ${ts}"
          # Retry push on rebase conflicts (concurrent runs)
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
