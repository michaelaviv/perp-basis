name: capture

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Take snapshot
        env:
          # fapi.binance.com returns HTTP 451 to US-located GitHub runners.
          # Route only the Binance collector through an EU-egress HTTP CONNECT proxy
          # (Oracle Cloud London VM). OKX / Hyperliquid / Yahoo skip the proxy.
          BINANCE_PROXY_URL: ${{ secrets.BINANCE_PROXY_URL }}
        run: python -m perp_basis.snapshot

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: perp-basis-bot
          GIT_AUTHOR_EMAIL: perp-basis-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-basis-bot
          GIT_COMMITTER_EMAIL: perp-basis-bot@users.noreply.github.com
        run: |
          # Enable the `merge=ours` driver referenced in .gitattributes so concurrent
          # cron runs auto-resolve the latest.json conflict (always keep the newest write).
          git config merge.ours.driver true
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M:%SZ")
          git commit -m "snapshot ${ts}"
          # Use merge (not rebase) so the merge=ours driver is honoured.
          for i in 1 2 3; do
            git pull --no-rebase --no-edit --strategy=ort -X ours && git push && exit 0
            echo "push attempt $i failed, retrying..."
            git merge --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
