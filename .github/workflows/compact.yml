name: compact

on:
  schedule:
    - cron: "5 0 * * *"   # daily 00:05 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "Day to compact (YYYY-MM-DD | today | yesterday)"
        default: "yesterday"
        required: false

permissions:
  contents: write

concurrency:
  group: compact
  cancel-in-progress: false

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compact day
        run: |
          DATE_ARG="${{ github.event.inputs.date }}"
          DATE_ARG="${DATE_ARG:-yesterday}"
          python -m perp_basis.compact --date "${DATE_ARG}"

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: perp-basis-bot
          GIT_AUTHOR_EMAIL: perp-basis-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-basis-bot
          GIT_COMMITTER_EMAIL: perp-basis-bot@users.noreply.github.com
        run: |
          git config merge.ours.driver true
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DATE_ARG="${{ github.event.inputs.date }}"
          DATE_ARG="${DATE_ARG:-yesterday}"
          git commit -m "compact ${DATE_ARG}"
          for i in 1 2 3; do
            git pull --no-edit --strategy=ort -X ours && git push && exit 0
            echo "push attempt $i failed, retrying..."
            git merge --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
