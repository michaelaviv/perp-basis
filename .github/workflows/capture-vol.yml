name: capture-vol

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Separate concurrency group from `capture` so vol runs alongside basis.
concurrency:
  group: capture-vol
  cancel-in-progress: false

jobs:
  snapshot_vol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Take vol snapshot
        run: python -m perp_basis.snapshot_vol

      - name: Commit and push if changed
        env:
          GIT_AUTHOR_NAME: perp-basis-bot
          GIT_AUTHOR_EMAIL: perp-basis-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: perp-basis-bot
          GIT_COMMITTER_EMAIL: perp-basis-bot@users.noreply.github.com
        run: |
          git config merge.ours.driver true
          # Explicit reconciliation strategy so `git pull` doesn't bail with
          # 'Need to specify how to reconcile divergent branches' when the
          # cron run lands during another push.
          git config pull.rebase false
          # Only stage the vol-pipeline outputs so we don't accidentally
          # commit work in flight from the basis pipeline. Stage each path
          # independently so a missing-but-optional path (e.g. options_daily/
          # before the first compaction) doesn't abort the whole add.
          for p in data/options_snapshots data/options_daily data/manifest.json data/vol_latest.json; do
            if [ -e "$p" ]; then
              git add -A -- "$p"
            else
              echo "(skipping missing $p)"
            fi
          done
          echo "--- staged diff summary ---"
          git diff --cached --stat | tail -20
          if git diff --cached --quiet; then
            echo "No vol changes to commit"
            exit 0
          fi
          ts=$(date -u +"%Y-%m-%d %H:%M:%SZ")
          git commit -m "vol snapshot ${ts}"
          for i in 1 2 3; do
            git pull --no-edit --strategy=ort -X ours && git push && exit 0
            echo "push attempt $i failed, retrying..."
            git merge --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after retries" >&2
          exit 1
